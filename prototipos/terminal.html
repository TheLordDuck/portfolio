<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thelordduck22 — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0e0c; --fg:#c9d1c8; --dim:#5f6b62; --green:#4ade80; --amber:#fbbf24; --blue:#60a5fa; --pink:#f472b6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--fg); font:400 14px/1.65 "JetBrains Mono", ui-monospace, monospace; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgb(255 255 255 / .018) 0 1px, transparent 1px 3px); }
  .win { max-width:900px; margin:24px auto; border:1px solid #1f2722; border-radius:10px; overflow:hidden; min-height:calc(100% - 48px); display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:8px; padding:10px 14px; background:#111613; border-bottom:1px solid #1f2722; color:var(--dim); font-size:12px; }
  .bar i { width:11px; height:11px; border-radius:50%; background:#2b332e; }
  .bar i:nth-child(1) { background:#f87171; } .bar i:nth-child(2) { background:#fbbf24; } .bar i:nth-child(3) { background:#4ade80; }
  .bar span { margin:0 auto; }
  #out { padding:20px; flex:1; overflow-wrap:anywhere; cursor:text; }
  pre { font:inherit; white-space:pre-wrap; }
  .p { color:var(--green); } .d { color:var(--dim); } .a { color:var(--amber); } .b { color:var(--blue); } .k { color:var(--pink); }
  .ascii { color:var(--green); line-height:1.15; font-size:12px; text-shadow:0 0 12px rgb(74 222 128 / .35); }
  button.cmd { font:inherit; background:none; border:0; color:var(--blue); cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
  button.cmd:hover { color:var(--amber); }
  .line { display:flex; gap:8px; }
  #in { flex:1; background:none; border:0; outline:0; color:var(--fg); font:inherit; caret-color:var(--green); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:2px 16px; }
  .block { margin:4px 0 14px; }
  @media (max-width:600px) { .win { margin:0; border-radius:0; border:0; min-height:100%; } .ascii { font-size:7px; } }
</style>
</head>
<body>
<div class="win">
  <div class="bar"><i></i><i></i><i></i><span>thelordduck22@portfolio: ~</span></div>
  <div id="out">
    <div id="log"></div>
    <div class="line"><span><span class="p">thelordduck22@portfolio</span>:<span class="b">~</span>$</span><input id="in" autocomplete="off" spellcheck="false" autofocus aria-label="Comando"></div>
  </div>
</div>
<script src="proyectos.js"></script>
<script>
  const log = document.getElementById("log"), input = document.getElementById("in");
  const slug = p => p.id;
  const hist = []; let hi = 0;
  const btn = c => `<button class="cmd" data-c="${c}">${c}</button>`;
  // Fuente de bloques 3x5 para dibujar el nick en ASCII
  const FUENTE = {
    T:["███"," █ "," █ "," █ "," █ "], H:["█ █","█ █","███","█ █","█ █"], E:["███","█  ","██ ","█  ","███"],
    L:["█  ","█  ","█  ","█  ","███"], O:["███","█ █","█ █","█ █","███"], R:["██ ","█ █","██ ","█ █","█ █"],
    D:["██ ","█ █","█ █","█ █","██ "], U:["█ █","█ █","█ █","█ █","███"], C:["███","█  ","█  ","█  ","███"],
    K:["█ █","█ █","██ ","█ █","█ █"], 2:["███","  █","███","█  ","███"],
  };
  const ascii = txt => [0, 1, 2, 3, 4].map(f => [...txt.toUpperCase()].map(ch => FUENTE[ch][f]).join(" ")).join("\n");
  const banner = `<pre class="ascii">${ascii("thelordduck22")}</pre>
<div class="block"><span class="d">Flavio · full-stack dev · escribe </span>${btn("help")}<span class="d"> o haz clic en cualquier comando</span></div>`;

  const cmds = {
    help: () => `<div class="block">Comandos disponibles:
  ${btn("whoami")}      quién soy
  ${btn("ls")}          lista de proyectos
  ${btn("ls -l")}       lista con detalles
  ${btn("tree")}        proyectos por categoría
  <span class="a">cat</span> &lt;proyecto&gt;  ver un proyecto  (ej. ${btn("cat bri-llar")})
  ${btn("stack")}       tecnologías que uso
  ${btn("contact")}     cómo contactarme
  ${btn("clear")}       limpiar pantalla</div>`,
    whoami: () => `<div class="block"><span class="a">thelordduck22</span> <span class="d">(</span>Flavio<span class="d">)</span>

Full-stack dev. Hago apps de gestión para negocios reales,
herramientas para mí, cosas de <span class="k">Magic: The Gathering</span> y algún juego en Godot.
Me gusta alojar mis cosas en mi propio servidor.</div>`,
    ls: () => `<div class="block grid">${PROYECTOS.map(p => `<span><button class="cmd" data-c="cat ${slug(p)}">${slug(p)}/</button></span>`).join("")}</div>`,
    "ls -l": () => `<div class="block">${PROYECTOS.map(p =>
      `<span class="d">drwxr-xr-x  ${p.año}  ${p.categoria.padEnd(12)}</span> <button class="cmd" data-c="cat ${slug(p)}">${slug(p)}/</button>  <span class="d"># ${p.corto}</span>`).join("<br>")}</div>`,
    tree: () => {
      const g = {}; PROYECTOS.forEach(p => (g[p.categoria] ||= []).push(p));
      const ks = Object.keys(g);
      return `<div class="block"><span class="b">~/proyectos</span><br>${ks.map((k, i) => {
        const last = i === ks.length - 1;
        return `${last ? "└──" : "├──"} <span class="a">${k}</span><br>` + g[k].map((p, j) =>
          `${last ? "    " : "│   "}${j === g[k].length - 1 ? "└──" : "├──"} <button class="cmd" data-c="cat ${slug(p)}">${slug(p)}</button>`).join("<br>");
      }).join("<br>")}</div>`;
    },
    stack: () => {
      const n = {}; PROYECTOS.forEach(p => p.stack.forEach(s => n[s] = (n[s] || 0) + 1));
      return `<div class="block">${Object.entries(n).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([s, c]) =>
        `${s.padEnd(14)} <span class="p">${"█".repeat(c * 3)}</span> <span class="d">${c}</span>`).join("<br>")}</div>`;
    },
    contact: () => `<div class="block">email    <a class="b" href="mailto:hola@ejemplo.com">hola@ejemplo.com</a>
github   <a class="b" href="#">github.com/…</a></div>`,
    clear: () => { log.innerHTML = ""; return ""; },
  };

  function cat(arg) {
    const p = PROYECTOS.find(p => slug(p) === arg);
    if (!p) return `<div class="block">cat: ${arg || "?"}: no existe. Prueba ${btn("ls")}</div>`;
    return `<div class="block"><span class="d"># ~/proyectos/${slug(p)}/README.md</span>

<span class="a">## ${p.nombre}</span>${p.estado ? ` <span class="k">[${p.estado}]</span>` : ""}
<span class="d">${p.año} · ${p.categoria}</span>

${p.descripcion}

<span class="d">stack:</span> ${p.stack.map(s => `<span class="b">${s}</span>`).join(", ")}</div>`;
  }

  function run(c, eco = true) {
    c = c.trim();
    if (eco) log.insertAdjacentHTML("beforeend", `<div><span class="p">thelordduck22@portfolio</span>:<span class="b">~</span>$ ${c.replace(/</g, "&lt;")}</div>`);
    if (!c) return;
    hist.push(c); hi = hist.length;
    const [name, ...rest] = c.split(/\s+/);
    let res;
    if (cmds[c]) res = cmds[c]();
    else if (name === "cat") res = cat(rest.join(" ").replace(/\/$/, ""));
    else if (name === "cd") res = cat(rest.join(" ").replace(/\/$/, ""));
    else if (name === "sudo") res = `<div class="block">buen intento 😏</div>`;
    else res = `<div class="block">${name}: comando no encontrado. Escribe ${btn("help")}</div>`;
    log.insertAdjacentHTML("beforeend", `<pre>${res}</pre>`);
    input.scrollIntoView({ block:"end" });
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button.cmd");
    if (b) run(b.dataset.c); else if (!getSelection().toString()) input.focus();
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { run(input.value); input.value = ""; }
    else if (e.key === "ArrowUp" && hi > 0) { input.value = hist[--hi]; e.preventDefault(); }
    else if (e.key === "ArrowDown") { input.value = hist[++hi] || ""; hi = Math.min(hi, hist.length); }
    else if (e.key === "Tab") {
      e.preventDefault();
      const m = input.value.match(/^(cat|cd) (.*)$/);
      if (m) { const f = PROYECTOS.map(slug).filter(s => s.startsWith(m[2])); if (f.length === 1) input.value = `${m[1]} ${f[0]}`; }
    }
  });

  log.innerHTML = banner;
  // efecto de escritura del primer comando
  const first = "whoami"; let i = 0;
  const t = setInterval(() => {
    input.value = first.slice(0, ++i);
    if (i === first.length) { clearInterval(t); setTimeout(() => { input.value = ""; run(first); run("help"); }, 300); }
  }, 90);
</script>
</body>
</html>
